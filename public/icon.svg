<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Vibrant Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Briefcase Outer Stroke Gradient -->
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Glowing Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" stroke="url(#borderGrad)" stroke-width="20"/>

  <!-- Briefcase Top Handle -->
  <path d="M196 178 V140 C196 112 218 90 246 90 H266 C294 90 316 112 316 140 V178"
        stroke="url(#caseGrad)" stroke-width="26" stroke-linecap="round" fill="none"/>

  <!-- Briefcase Main Body -->
  <rect x="96" y="178" width="320" height="224" rx="44" fill="#0f172a" stroke="url(#caseGrad)" stroke-width="24"/>

  <!-- Horizontal Divider / Lapel Seam -->
  <path d="M98 266 H414" stroke="url(#caseGrad)" stroke-width="16" opacity="0.45"/>

  <!-- Center Opportunity Clasp / Lock -->
  <rect x="228" y="246" width="56" height="42" rx="12" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="267" r="5" fill="#0f172a"/>

  <!-- Upward Career Star / Opportunity Spark (Top Right) -->
  <path d="M386 86 L396 114 L424 124 L396 134 L386 162 L376 134 L348 124 L376 114 Z"
        fill="url(#accentGrad)"/>
</svg>